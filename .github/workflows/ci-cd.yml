name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

# corridas antigas do mesmo ref sao canceladas quando chega um push novo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # o ghcr.io rejeita maiuscula no nome da imagem e github.repository preserva
  # o case do dono (UlyssesLopes), entao o caminho vai em minusculo na mao
  IMAGE_NAME: ghcr.io/ulysseslopes/petfy-healthcare

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # verify ja roda os testes e gera o relatorio do jacoco (a execucao 'report'
      # esta amarrada na fase verify no pom), entao nao precisa de passo separado
      - name: Build e testes
        run: mvn -B clean verify

      # retencao curta de proposito: relatorio de teste interessa no dia em que a
      # corrida falha, e a retencao default do repositorio (90 dias) transformava
      # cada push num deposito que ninguem abre
      - name: Publica relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 5

      # NAO existe passo que publique o jar como artefato, e a ausencia e
      # deliberada: ele existia de quando o pipeline entregava jar pronto para a
      # imagem consumir. Hoje o Dockerfile e multi-stage e compila de dentro do
      # build, e o Railway constroi do repositorio - ninguem baixava aquilo.
      # Eram 79 MB por push em toda branch, 9 GB acumulados ate 2026-08-07, o que
      # levou a cota de armazenamento do Actions a 90%. O gate de que o jar
      # empacota continua sendo o 'mvn verify' acima
      # so roda quando SONAR_TOKEN estiver configurado no repositorio; sem isso
      # o passo e pulado em vez de quebrar o pipeline inteiro
      - name: Analise SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=petfy-healthcare
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.login=$SONAR_TOKEN

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # sem isso o build-push-action usa o driver docker padrao, que nao sabe
      # exportar cache: o cache-to abaixo falha antes de o build comecar
      - name: Prepara o buildx
        uses: docker/setup-buildx-action@v4

      # o login so e necessario para publicar; em PR o job constroi e descarta
      - name: Login no GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # o build roda em toda branch e em todo PR, porque a imagem e o artefato de
      # deploy e quebra nela nao pode chegar na main sem ninguem ver. Publicar,
      # esse sim, so a partir da main
      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # o Dockerfile agora compila o jar dentro do build, entao sem cache
          # cada execucao baixaria as dependencias do Maven de novo.
          # mode=min e nao max: 'max' grava tambem as camadas intermediarias do
          # stage de build do Maven, e foi o que levou o cache a 10,6 GB contra o
          # teto de 10 GB do repositorio - passando do teto o GitHub evicta por
          # LRU, entao pagava-se a gravacao e ainda se tomava miss
          cache-from: type=gha
          cache-to: type=gha,mode=min

          # sem attestation de proveniencia: cada push publicava um manifesto
          # extra no ghcr, que aparece na listagem 'sem tag' e nao e consumido por
          # nada aqui - o Railway constroi do repositorio e nao puxa a imagem
          provenance: false
