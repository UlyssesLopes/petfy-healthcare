# Ambiente de dev: hospedado, mas e onde o desenvolvimento acontece. Herda tudo
# de hosted e ajusta o que faz sentido diferente aqui.
#
# stg e prd nao tem arquivo proprio: o que os diferencia sao valores de variavel
# de ambiente (banco, segredo, canal de notificacao), nao estrutura de config.
# Criar arquivo vazio para eles seria so ruido.

# religado aqui, como no local: em dev ver a query e o objetivo. Isso pressupoe
# que o banco de dev nao tem dado real de tutor - copiar base de outro ambiente
# para ca transformaria o log em vazamento
spring.jpa.show-sql=true

# O canal continua vindo de NOTIFICATIONS_CHANNEL, com log por default, para dev
# nao enviar e-mail sem que alguem tenha pedido. Quando for desenvolver os fluxos
# que dependem de envio - recuperacao de senha, lembrete - aponte spring.mail.*
# para uma caixa de captura, nao para um SMTP que entrega de verdade: os
# enderecos que existirem na base de dev sao de pessoas reais se vierem de fora
