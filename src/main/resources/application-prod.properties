# Aplicacao em producao, banco gerenciado pelo provedor de hospedagem.
#
# Exige SPRING_PROFILES_ACTIVE=prod no ambiente. A imagem publicada pelo
# pipeline traz SPRING_PROFILES_ACTIVE=docker no Dockerfile, que serve para
# rodar o container contra o banco da propria maquina - esquecer de sobrescrever
# aqui faz a aplicacao tentar host.docker.internal e nao subir.
#
# DB_HOST e DB_NAME nao tem default, pelo mesmo motivo do JWT_SECRET: em
# producao e melhor nao subir do que subir apontando para o lugar errado.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}

# sslmode=require cifra a conexao sem exigir que o certificado do provedor seja
# validavel por uma CA conhecida, que e o caso comum em Postgres gerenciado.
# Onde o certificado for verificavel, DB_SSLMODE=verify-full e melhor

# vazio de proposito: dentro do container quem resolve o caminho e o
# TESSDATA_PREFIX definido no ENTRYPOINT do Dockerfile
petfy.ocr.tessdata-path=${TESSDATA_PATH:}
