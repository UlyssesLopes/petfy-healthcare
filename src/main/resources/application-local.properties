# Aplicacao rodando na maquina (IDE / mvn spring-boot:run),
# banco no container do docker-local/docker-compose.yaml
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petfy}

petfy.ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}

# em desenvolvimento ver a query e o objetivo, e o banco nao tem dado real
spring.jpa.show-sql=true

# so em desenvolvimento: chave conhecida para nao precisar exportar variavel
# toda vez que subir pela IDE. Qualquer outro perfil exige JWT_SECRET
petfy.jwt.secret=${JWT_SECRET:petfy-desenvolvimento-local-nao-usar-em-producao}
