spring.application.name=petfy-healthcare
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Os tres ambientes hospedados compartilham a mesma config de infraestrutura e
# se diferenciam por valor, nao por estrutura. Em vez de tres arquivos quase
# iguais, cada ambiente e um grupo que inclui o perfil hosted: subir com
# SPRING_PROFILES_ACTIVE=dev ativa dev e hosted juntos.
spring.profiles.group.dev=hosted
spring.profiles.group.stg=hosted
spring.profiles.group.prd=hosted

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:petfy}
spring.datasource.password=${DB_PASSWORD:petfy}

# quem cria e evolui o schema e o Flyway; o Hibernate so confere se o
# mapeamento bate com o que esta no banco
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# desligado por padrao: o SQL logado carrega valor de coluna, e dado de saude
# de pet e dado pessoal de tutor nao devem vazar para o log. O perfil local
# religa, onde ver a query e o que se quer
spring.jpa.show-sql=false

# health e publico (o provedor de hospedagem chama sem credencial).
# prometheus e exposto mas protegido por token no SecurityConfig: dados de
# carga e contagem de requisicoes nao devem ser publicos.
# info exige token, como qualquer outra rota.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# O actuator registra sozinho um health indicator de mail assim que existe
# spring.mail.host, e ele abre uma conexao SMTP a cada checagem. Isso amarra a
# saude da aplicacao a um servico de terceiro: com o SMTP fora, o health vira
# DOWN, o provedor conclui que a instancia morreu e reinicia em loop - com a API
# funcionando perfeitamente, porque ela nao precisa de e-mail para responder.
#
# Falha de envio ja e tratada onde importa: o aviso ao tutor captura e loga, e o
# lembrete deixa a dose elegivel para a proxima varredura.
management.health.mail.enabled=false

# o default do Spring e 1MB, insuficiente para foto de celular da carteirinha
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

petfy.ocr.language=por

# sem valor default de proposito: fora do perfil local a aplicacao nao sobe sem
# JWT_SECRET, em vez de assinar token com uma chave que esta no repositorio.
# HS256 exige no minimo 32 caracteres
petfy.jwt.secret=${JWT_SECRET}
petfy.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Canal de notificacao, comum a lembretes e avisos de vacina registrada.
#
#   log    - escreve no log da aplicacao
#   resend - API HTTP, exige RESEND_API_KEY
#   email  - SMTP, exige spring.mail.* configurado abaixo
#
# resend existe porque o provedor de hospedagem bloqueia saida em porta de SMTP:
# a conexao nunca se estabelece, e nenhuma configuracao vence isso. O canal email
# continua aqui para ambiente onde SMTP funcione
petfy.notifications.channel=${NOTIFICATIONS_CHANNEL:log}
petfy.notifications.resend.api-key=${RESEND_API_KEY:}

# O remetente aceito depende do canal:
#
#   resend - so endereco de dominio verificado. Sem dominio proprio, o unico
#            valor possivel e onboarding@resend.dev, que por regra do Resend
#            entrega apenas para o e-mail dono da conta - suficiente para dev,
#            insuficiente no dia em que houver tutor de verdade
#   email  - Gmail e Workspace recusam From diferente da conta autenticada,
#            entao aqui o default e o proprio MAIL_USERNAME
petfy.notifications.from=${NOTIFICATIONS_FROM:${MAIL_USERNAME:onboarding@resend.dev}}

# SMTP. Sem MAIL_USERNAME e MAIL_PASSWORD o canal email nao autentica - e por
# isso que o default do canal e log: um ambiente sem credencial nao tenta enviar
# e falhar, ele escreve no log.
#
# smtp.gmail.com serve tanto para Gmail comum quanto para Google Workspace, e em
# ambos a senha precisa ser uma senha de app, gerada com 2FA ligado. A senha da
# conta e recusada.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts explicitos porque o default do JavaMail e esperar para sempre: um SMTP
# que aceita a conexao e nao responde prenderia uma thread do pool de envio ate a
# aplicacao reiniciar
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:5000}

# Rotina diaria de lembretes.
# Desligada por padrao: com mais de uma instancia no ar, todas disparariam a
# rotina e o tutor receberia o lembrete repetido. Ligar exige decidir quem
# executa - uma instancia so, ou um agendador externo. Isso nao afeta o aviso
# de vacina registrada, que sai na hora do registro e nao depende de agendador.
petfy.reminders.enabled=${REMINDERS_ENABLED:false}
petfy.reminders.window-days=${REMINDERS_WINDOW_DAYS:30}
petfy.reminders.cooldown-days=${REMINDERS_COOLDOWN_DAYS:7}
petfy.reminders.cron=${REMINDERS_CRON:0 0 9 * * *}

# Idade maxima em dias para o pet ser considerado filhote e ganhar o esquema
# inicial de vacinacao no cadastro. 120 dias = 4 meses; o esquema padrao
# canino e felino se completa por volta disso. Cadastro de pet mais velho segue
# o comportamento anterior (so a proxima dose anual do catalogo).
petfy.puppy.max-age-days=${PUPPY_MAX_AGE_DAYS:120}

# validade padrao do link de compartilhamento da carteira
petfy.share.default-expiration-days=${SHARE_EXPIRATION_DAYS:30}

# Recuperacao de senha. A validade e curta de proposito: o token da acesso a
# trocar a senha da conta, entao a janela de quem interceptar o e-mail deve ser
# a menor possivel sem atrapalhar quem realmente pediu.
#
# O cooldown impede que o endpoint publico vire maquina de enviar e-mail para
# terceiros - sem ele, basta repetir a chamada com o e-mail de alguem
petfy.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
petfy.password-reset.cooldown-minutes=${PASSWORD_RESET_COOLDOWN_MINUTES:5}

# Confirmacao de e-mail. Validade bem mais longa que a da recuperacao de senha
# porque o que esta em jogo e diferente: este token confirma um endereco, aquele
# troca a senha da conta. Enquanto nao confirmar, a conta funciona mas nao
# recebe notificacao nenhuma
petfy.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
petfy.email-verification.cooldown-minutes=${EMAIL_VERIFICATION_COOLDOWN_MINUTES:5}

# Rate limiting por IP em endpoints publicos sensiveis.
# Aplicado antes do JWT para nao gastar validacao de token em flood.
# login: 10 tentativas/min (brute force de senha).
# restrito: 5 req/min para cadastro, reset de senha e reenvio de verificacao.
petfy.rate-limit.login-por-minuto=${RATE_LIMIT_LOGIN:10}
petfy.rate-limit.restrito-por-minuto=${RATE_LIMIT_RESTRITO:5}

# Paginacao das listagens. O teto existe para ?size=999999 nao empurrar o
# problema de volume para o banco - acima de max-page-size o Spring corta para o
# teto em vez de recusar, entao o cliente que exagerar recebe 100, nao um erro.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# validade padrao do convite para entrar numa clinica. Curta de proposito: o
# convite da acesso aos pets que a clinica atende, entao nao deve ficar valido
# por semanas depois que a pessoa ja entrou (ou desistiu)
petfy.clinic-invite.default-expiration-days=${CLINIC_INVITE_EXPIRATION_DAYS:7}

# por quantos dias apos o registro a clinica ainda pode corrigi-lo. Curto de
# proposito: cobre o erro percebido logo apos o atendimento, nao a reescrita de
# historico antigo
petfy.vet.correction-window-days=${VET_CORRECTION_WINDOW_DAYS:7}

# Versao vigente de cada documento aceito no cadastro. Trocar o valor faz os aceites
# anteriores virarem pendentes em GET /consents/me, que e o comportamento desejado
# quando o texto muda - ver V16__consentimento.sql.
petfy.consent.terms-version=${CONSENT_TERMS_VERSION:2026-08-05}
petfy.consent.privacy-version=${CONSENT_PRIVACY_VERSION:2026-08-05}

# Desligado explicitamente. Ligado (o default), a sessao do Hibernate fica aberta
# durante a serializacao da resposta, e associacao lazy tocada pelo Jackson vira query
# na renderizacao - fora da transacao, sem controle e sem aparecer no teste. Com ele
# desligado, tocar lazy fora da transacao falha alto, que e o que se quer.
spring.jpa.open-in-view=false
