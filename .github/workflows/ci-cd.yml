name: CI backend

# ------------------------------------------------------------------ o que este pipeline e
#
# UM job, um proposito: rodar a suite contra Postgres de verdade antes de o codigo chegar
# na main. Nada mais.
#
# O nome ganhou "backend" em 2026-08-07, quando o front nasceu e passou a existir um
# segundo pipeline (ci-web.yml). Sao dois arquivos, e nao dois jobs no mesmo, porque
# `paths` no GitHub Actions filtra o WORKFLOW inteiro - nao da para um job ouvir `web/` e
# o outro ouvir `src/` dentro do mesmo arquivo sem uma action de terceiro no meio.
#
# POR QUE ELE EXISTE, SE O DEPLOY NAO PASSA POR AQUI. O Railway constroi do
# repositorio e sobe a main sozinho - este pipeline nao publica, nao empacota e nao
# implanta. O que ele faz e ser a unica coisa entre um commit ruim e o ambiente no ar: sem
# ele, a primeira noticia de uma migration quebrada e a aplicacao nao subindo no dev.
#
# E ha um motivo especifico deste projeto: os testes de container falham de forma
# INTERMITENTE no Windows - o daemon responde ao CLI e o isDockerAvailable() do
# Testcontainers devolve false. Este runner e hoje o unico lugar onde as migrations rodam
# contra Postgres sem depender de sorte.
#
# ------------------------------------------------------------------ o que saiu, e por que
#
# JOB docker (2026-08-07). Construia a imagem e publicava no ghcr. Ninguem puxava: o
# Railway constroi do repositorio, e o registry privado nao tem onde receber credencial na
# UI dele. Era deploy artifact sem consumidor - 199 MB por push na main, e o que estufou a
# cota de armazenamento junto com o jar.
#
# UPLOAD DO RELATORIO (2026-08-07). Subia surefire e jacoco a cada corrida. Com a cota
# cheia ele passou a falhar, e pintava de vermelho corridas com 749 testes passando - o
# pior tipo de sinal, o que treina a ignorar. Quem precisar do relatorio roda
# `mvn verify` e abre target/site/jacoco.
#
# PUSH EM TODA BRANCH (2026-08-07). Eram 143 corridas em 4 dias, 76 num unico dia, quase
# todas push de branch em andamento. A pergunta que importa - "isto pode entrar na main?" -
# se responde no PR. Push de branch continua sem corrida, e quem quiser conferir antes roda
# a suite na maquina.

# FILTRO POR CAMINHO (2026-08-07). Sem ele, mudanca de CSS dispara 761 testes Java com
# Postgres em container. O que fica de fora e so o que nao pode alterar o comportamento do
# backend.
#
# `contract/` NAO esta na lista, e a ausencia e deliberada: os dois arquivos de la sao
# gerados pelo OpenApiContractTest e pelo ErrorCodesContractTest, entao quem os editar a
# mao precisa exatamente que estes testes rodem e reprovem.
#
# CONSEQUENCIA A SABER: num PR que so toca o front, este pipeline nao corre - e nao
# aparece corrida nenhuma dele na pagina do PR. Isso hoje nao trava nada porque a `main`
# nao tem branch protection (repositorio privado em plano free). No dia em que tiver, um
# check exigido e filtrado por caminho fica pendente para sempre, e a saida e um job
# "sentinela" que sempre roda e reporta sucesso.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'web/**'
      - 'design/**'
      - '**.md'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [ main ]
    paths-ignore:
      - 'web/**'
      - 'design/**'
      - '**.md'
      - '.github/workflows/ci-web.yml'

# corridas antigas do mesmo ref sao canceladas quando chega um push novo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # verify ja roda os testes e gera o relatorio do jacoco (a execucao 'report' esta
      # amarrada na fase verify no pom), entao nao precisa de passo separado.
      #
      # NAO ha escape de container aqui, e a ausencia e deliberada: rodar com
      # -Dpetfy.allow-skipping-container-tests=true tornaria este job capaz de passar sem
      # validar nenhuma migration, que e exatamente a falsa confianca que a sentinela
      # ContainerTestsHabilitadosTest existe para impedir.
      - name: Build e testes
        run: mvn -B clean verify

      # so roda quando SONAR_TOKEN estiver configurado no repositorio; sem isso o passo e
      # pulado em vez de quebrar o pipeline inteiro
      - name: Analise SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=petfy-healthcare
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.login=$SONAR_TOKEN
