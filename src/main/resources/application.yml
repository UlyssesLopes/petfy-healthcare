spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/petfy_db
    username: petfy_user
    password: petfy_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    format-sql: true

server:
  port: 8080