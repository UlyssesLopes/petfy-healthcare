# Config comum a qualquer ambiente hospedado: dev, stg e prd.
#
# Nao e ativado direto. Os tres ambientes sao profile groups declarados no
# application.properties, e cada um inclui este arquivo - assim o que e igual nos
# tres mora num lugar so, e o que diferencia fica no perfil do ambiente ou na
# variavel de ambiente.
#
# Exige SPRING_PROFILES_ACTIVE=dev, stg ou prd. A imagem publicada pelo pipeline
# traz SPRING_PROFILES_ACTIVE=docker no Dockerfile, que serve para rodar o
# container contra o banco da propria maquina - esquecer de sobrescrever faz a
# aplicacao tentar host.docker.internal e nao subir.
#
# DB_HOST e DB_NAME nao tem default, pelo mesmo motivo do JWT_SECRET: num
# ambiente hospedado e melhor nao subir do que subir apontando para o lugar
# errado. Vale inclusive para o dev: apontar sem perceber para o banco de outro
# ambiente e pior do que nao subir.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}

# o provedor escolhe a porta e injeta em PORT, esperando que a aplicacao escute
# nela. Sem isso o Spring sobe fixo em 8080, o health check nao encontra ninguem
# e o deploy e dado como morto. 8080 fica como default para rodar o container
# fora de um provedor
server.port=${PORT:8080}

# sslmode=require cifra a conexao sem exigir que o certificado do provedor seja
# validavel por uma CA conhecida, que e o caso comum em Postgres gerenciado.
# Onde o certificado for verificavel, DB_SSLMODE=verify-full e melhor

# vazio de proposito: dentro do container quem resolve o caminho e o
# TESSDATA_PREFIX definido no ENTRYPOINT do Dockerfile
petfy.ocr.tessdata-path=${TESSDATA_PATH:}
