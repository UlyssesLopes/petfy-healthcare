spring.application.name=petfy-healthcare
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:petfy}
spring.datasource.password=${DB_PASSWORD:petfy}

# quem cria e evolui o schema e o Flyway; o Hibernate so confere se o
# mapeamento bate com o que esta no banco
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# o default do Spring e 1MB, insuficiente para foto de celular da carteirinha
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

petfy.ocr.language=por

# sem valor default de proposito: fora do perfil local a aplicacao nao sobe sem
# JWT_SECRET, em vez de assinar token com uma chave que esta no repositorio.
# HS256 exige no minimo 32 caracteres
petfy.jwt.secret=${JWT_SECRET}
petfy.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Lembretes de vacina.
# Desligado por padrao: com mais de uma instancia no ar, todas disparariam a
# rotina e o tutor receberia o lembrete repetido. Ligar exige decidir quem
# executa - uma instancia so, ou um agendador externo.
petfy.reminders.enabled=${REMINDERS_ENABLED:false}
# log escreve no log da aplicacao; email exige spring.mail.* configurado
petfy.reminders.channel=${REMINDERS_CHANNEL:log}
petfy.reminders.window-days=${REMINDERS_WINDOW_DAYS:30}
petfy.reminders.cooldown-days=${REMINDERS_COOLDOWN_DAYS:7}
petfy.reminders.cron=${REMINDERS_CRON:0 0 9 * * *}
