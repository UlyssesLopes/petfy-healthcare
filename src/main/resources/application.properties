spring.application.name=petfy-healthcare
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:petfy}
spring.datasource.password=${DB_PASSWORD:petfy}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# o default do Spring e 1MB, insuficiente para foto de celular da carteirinha
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

petfy.ocr.language=por
